      type: object
      description: A single order item.
      required:
      - orderItemId
      - quantity
      properties:
        orderItemId:
          type: string
          description: The order item's unique identifier.
        quantity:
          type: integer
          description: The item's quantity.
        transparencyCodes:
          description: The list of transparency codes.
          $ref: '#/components/schemas/TransparencyCodeList'
    ProductInfoDetail:
      type: object
      properties:
