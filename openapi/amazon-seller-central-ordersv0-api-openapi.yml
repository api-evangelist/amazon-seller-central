          type: string
          description: The total number of items that are included in the ASIN.
      description: Product information on the number of items.
    InterimStatusDetail:
      type: object
      required:
      - statusCode
      - statusDateTime
      properties:
        statusCode:
          type: string
          description: The identifier for the interim status type. Must be one of the `ValidInterimStatusCodes` values returned by the `getOrderRegulatedInfo` operation.
        statusDateTime:
          type: string
          description: The date and time when this interim status was set, in [ISO 8601](https://developer-docs.amazon.com/sp-api/docs/iso-8601) date and time format.
          format: date-time
      description: Interim status information provided during the verification process to share granular progress updates while an order is pending verification (for example, vet contacted through email).
    OrderList:
      type: array
      description: A list of orders.
      items:
        $ref: '#/components/schemas/Order'
    VerificationStatus:
      type: string
      description: The verification status of the order.
      enum:
      - Pending
      - Approved
      - Rejected
      - Expired
      - Cancelled
      x-docgen-enum-table-extension:
      - value: Pending
        description: The order is pending approval. Note that the approval might be needed from someone other than the merchant as determined by the `RequiresMerchantAction` property.
      - value: Approved
        description: The order's regulated information has been reviewed and approved.
      - value: Rejected
        description: The order's regulated information has been reviewed and rejected.
      - value: Expired
        description: The time to review the order's regulated information has expired.
      - value: Cancelled
        description: The order was cancelled by the purchaser.
    RegulatedInformation:
      type: object
      description: The regulated information collected during purchase and used to verify the order.
      required:
      - Fields
      properties:
        Fields:
          type: array
          description: A list of regulated information fields as collected from the regulatory form.
          items:
            $ref: '#/components/schemas/RegulatedInformationField'
