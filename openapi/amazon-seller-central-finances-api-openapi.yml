              description: Unique request reference identifier.
              schema:
                type: string
          x-amzn-api-sandbox:
            static:
            - request:
                parameters:
                  postedBefore:
                    value: '2022-03-07'
              response:
                errors:
                - code: InvalidInput
                  message: Start date cannot be null
                  details: Start date cannot be null
          content:
