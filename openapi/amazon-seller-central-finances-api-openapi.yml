        required: false
        x-example: Standard Orders
        schema:
          type: string
      - name: relatedIdentifierName
        in: query
        description: The name of the `relatedIdentifier`. The only possible value is `SETTLEMENT_ID`, the settlement ID associated with the summary.
        required: false
