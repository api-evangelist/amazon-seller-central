paths:
  /finances/2024-06-19/transactions:
    get:
      description: 'Returns transactions for the given parameters. Financial events might not include orders from the last 48 hours. **Note:** If you want to retrieve MFN orders in the US store, do not supply the `marketplaceId` parameter.


        **Usage plan:**


        | Rate (requests per second) | Burst |

        | ---- | ---- |

        | 0.5 | 10 |


        The `x-amzn-RateLimit-Limit` response header returns the usage plan rate limits that were applied to the requested operation, when available. The preceding table contains the default rate and burst values for this operation. Selling partners whose business demands require higher throughput may have higher rate and burst values than those shown here. For more information, refer to [Usage Plans and Rate Limits](https://developer-docs.amazon.com/sp-api/docs/usage-plans-and-rate-limits).'
      operationId: listTransactions
      parameters:
      - name: postedAfter
        in: query
        description: 'The response includes financial events posted on or after this date. This date must be in [ISO 8601](https://developer-docs.amazon.com/sp-api/docs/iso-8601) date-time format. The date-time must be more than two minutes before the time of the request.


          This field is required if you do not specify a related identifier.'
        required: false
        x-example: '2023-01-12'
        schema:
          type: string
          format: date-time
      - name: postedBefore
        in: query
        description: 'The response includes financial events posted before (but not on) this date. This date must be in [ISO 8601](https://developer-docs.amazon.com/sp-api/docs/iso-8601) date-time format.


          The date-time must be later than `PostedAfter` and more than two minutes before the request was submitted. If `PostedAfter` and `PostedBefore` are more than 180 days apart, the response is empty.


          **Default:** Two minutes before the time of the request.'
        required: false
        x-example: '2023-02-12'
        schema:
          type: string
          format: date-time
      - name: marketplaceId
        in: query
        description: The identifier of the marketplace from which you want to retrieve transactions. The marketplace ID is the globally unique identifier of a marketplace. To find the ID for a marketplace, refer to [Marketplace IDs](https://developer-docs.amazon.com/sp-api/docs/marketplace-ids).
        required: false
        x-example: ATIV93840DER
        schema:
          type: string
      - name: transactionStatus
        in: query
        description: 'The status of the transaction.


          **Possible values:**


          * `DEFERRED`: the transaction is currently deferred.

          * `RELEASED`: the transaction is currently released.

          * `DEFERRED_RELEASED`: the transaction was deferred in the past, but is now released. The status of a deferred transaction is updated to `DEFERRED_RELEASED` when the transaction is released.'
        required: false
        x-example: RELEASED
        schema:
          type: string
      - name: relatedIdentifierName
        in: query
        description: "The name of the `relatedIdentifier`.\n\n**Possible values:**\n\n* `FINANCIAL_EVENT_GROUP_ID`: the financial event group ID associated with the transaction.\n\n* `ORDER_ID`: the order ID associated with the transaction.  \n\n**Note:**\n\n`FINANCIAL_EVENT_GROUP_ID` and `ORDER_ID` are the only `relatedIdentifier` with filtering capabilities at the moment. While other `relatedIdentifier` values will be included in the response when available, they cannot be used for filtering purposes."
        required: false
        x-example: FINANCIAL_EVENT_GROUP_ID
        schema:
          type: string
      - name: relatedIdentifierValue
        in: query
        description: The value of the `relatedIdentifier`.
        required: false
        x-example: '8129762527551'
        schema:
          type: string
      - name: nextToken
        in: query
        description: The response includes `nextToken` when the number of results exceeds the specified `pageSize` value. To get the next page of results, call the operation with this token and include the same arguments as the call that produced the token. To get a complete list, call this operation until `nextToken` is null. Note that this operation can return empty pages.
        required: false
        x-example: jehgri34yo7jr9e8f984tr9i4o
        schema:
          type: string
      responses:
        '200':
          description: Success.
          headers:
            x-amzn-RateLimit-Limit:
              description: Your rate limit (requests per second) for this operation.
              schema:
                type: string
            x-amzn-RequestId:
