- aid: amazon-seller-central:selling-partner-connector-mcp
  name: Amazon Selling Partner Connector (MCP)
  description: Amazon's first-party remote MCP server for Seller Central (streamable HTTP), announced at Amazon Accelerate on 2026-09-23 and in
    beta for US stores. Sellers authorize access through the Seller Central OAuth consent flow; the assistant can only use tools the seller's
    Seller Central roles allow, and write actions (listing, price, FBA inbound changes) are drafted for the seller's approval. Tools cover listings,
    FBA inbound and inventory, sales and analytics metrics, and an SP-API documentation knowledge base. Bundled in the Selling Partner Agentic
    Toolkit Claude plugin.
  humanURL: https://github.com/amzn/selling-partner-agentic-toolkit
  baseURL: https://sellingpartner-ai.amazon.com/mcp
