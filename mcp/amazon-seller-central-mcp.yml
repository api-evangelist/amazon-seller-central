description: Amazon's first-party remote MCP server, the Amazon Selling Partner Connector, at https://sellingpartner-ai.amazon.com/mcp
  (streamable HTTP). Announced at Amazon Accelerate on 2026-09-23 alongside the Selling Partner Agentic
  Toolkit, a Claude plugin that bundles this server in .mcp.json with 11 skills and 3 commands; merged
  into Anthropic's official plugin marketplace the same day. Beta, US stores. Access is granted through
  the Seller Central OAuth consent flow; the assistant can only use tools the seller's Seller Central
  roles allow, and write actions are human-in-the-loop (drafted for the seller's approval). Account admins
  grant AI-agent access to secondary users in Seller Central "Manage Agents". tools/list is auth-gated,
  so the tool names below are the ones Amazon's own skills invoke, not a live listing.
server:
  name: amazon-selling-partner
  label: Amazon Selling Partner Connector
  transport: http
  url: https://sellingpartner-ai.amazon.com/mcp
  auth: oauth2
  auth_detail: Seller Central OAuth consent (authorization_endpoint https://sellercentral.amazon.com/apps/agents/authorize,
    token_endpoint https://api.amazon.com/auth/o2/token); PKCE S256; Client ID Metadata Documents supported,
    no dynamic client registration endpoint. See well-known/.
  status: beta
  availability: US stores
  announced: '2026-09-23'
  human_in_the_loop: Write actions are drafted for approval and never executed without explicit seller
    approval (toolkit README).
  authorization_scope: Limited to the tools the seller's Seller Central roles allow.
  docs: https://github.com/amzn/selling-partner-agentic-toolkit
  clients:
  - Claude
