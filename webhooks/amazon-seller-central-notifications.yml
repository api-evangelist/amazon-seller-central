provider: Amazon Selling Partner API
providerId: amazon-seller-central
description: 'SP-API event surface. The Notifications API (/notifications/v1, 10 operations) creates destinations
  and subscribes a selling partner to notification types; Amazon then pushes notifications to the destination.
  Delivery is to AWS infrastructure, not to an HTTP webhook URL: an Amazon SQS queue (destination resource
  sqs.arn) or an Amazon EventBridge partner event source (eventBridge.accountId + region). Amazon publishes
  a JSON Schema for each notification payload in amzn/selling-partner-api-models/schemas/notifications,
  saved verbatim under json-schema/notifications/. No AsyncAPI document is published; this catalogue is
  the machine-readable stand-in.'
asyncapi_published: false
delivery:
  transports:
  - type: Amazon SQS
    destination_field: sqs.arn
    note: ARN pattern ^arn:aws:sqs:\S+:\S+:\S+ per the Notifications model
  - type: Amazon EventBridge
    destination_field: eventBridge (accountId, region)
    note: Creates a partner event source in the named AWS account and region
  filtering: processingDirective.eventFilter (marketplace, aggregation period, order-change-type filters)
    per the Notifications model
